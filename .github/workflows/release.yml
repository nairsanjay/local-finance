name: Build and release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build embedded frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: Build ${{ matrix.asset }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: local-finance-linux-amd64
            binary: local-finance
            archive: local-finance-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            asset: local-finance-linux-arm64
            binary: local-finance
            archive: local-finance-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            asset: local-finance-darwin-amd64
            binary: local-finance
            archive: local-finance-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            asset: local-finance-darwin-arm64
            binary: local-finance
            archive: local-finance-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            asset: local-finance-windows-amd64
            binary: local-finance.exe
            archive: local-finance-windows-amd64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          OUTPUT: ${{ matrix.binary }}
        run: go build -trimpath -ldflags="-s -w" -o "dist/${OUTPUT}" ./cmd/server/main.go

      - name: Package Unix binary
        if: matrix.goos != 'windows'
        env:
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mv dist/local-finance "dist/${ASSET}"
          tar -C dist -czf "dist/${ARCHIVE}" "${ASSET}"

      - name: Package Windows binary
        if: matrix.goos == 'windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: cd dist && zip "${ARCHIVE}" local-finance.exe

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: local-finance-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --generate-notes --verify-tag
          fi
